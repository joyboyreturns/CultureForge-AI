# One service: the built studio and the API on one origin, with durable /data.
#   docker compose up --build
# Secrets come from .env (never baked into the image). RUN_PROFILE=judging
# lifts the call-count budgets; see docs/DEPLOY.md.
services:
  cultureforge:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      RUN_PROFILE: ${RUN_PROFILE:-dev}
    volumes:
      - cultureforge-data:/data
    restart: unless-stopped

volumes:
  cultureforge-data: {}
