<!doctype html><html><head><meta charset="utf-8"><title>Thumbnail</title>
<style>
@font-face{font-family:"Geist Pixel Circle";src:url("../../../fonts/GeistPixel-Circle.woff2") format("woff2");}
:root{--bg:#07070b;--text:#f7f5f2;--muted:#c6c1cf;--accent:#c7a3ff;--peach:#f0b08f;--coral:#f29a85;--mint:#9fe3c4}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;background:var(--bg);overflow:hidden;font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--text)}
.bg{position:absolute;inset:0;background:
 radial-gradient(700px 520px at 88% 8%,rgba(199,163,255,.38),transparent 65%),
 radial-gradient(760px 560px at 8% 105%,rgba(240,176,143,.36),transparent 65%),
 radial-gradient(500px 400px at 60% 60%,rgba(242,154,133,.10),transparent 70%)}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:26px 26px;mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.brand{position:absolute;left:64px;top:52px;display:flex;gap:14px;align-items:center;font-size:27px;font-weight:600;letter-spacing:.2px}
.dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--accent))}
.brand b{font-size:14px;font-weight:600;padding:3px 8px;border-radius:7px;background:rgba(199,163,255,.2);color:var(--accent)}
h1{position:absolute;left:60px;top:150px;width:640px;font-family:"Geist Pixel Circle",monospace;font-weight:400;font-size:112px;line-height:1.0;letter-spacing:-1px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--peach),var(--accent));-webkit-background-clip:text;color:transparent}
.sub{position:absolute;left:66px;top:560px;font-size:30px;color:var(--muted);line-height:1.35;max-width:600px}
.foot{position:absolute;left:66px;bottom:44px;font-size:19px;letter-spacing:3px;text-transform:uppercase;color:#a79fb8}
.card{position:absolute;right:56px;top:128px;width:460px;border-radius:28px;padding:34px 36px 36px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.18);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(10px)}
.lab{font-size:15px;letter-spacing:3.5px;text-transform:uppercase;color:#a79fb8;display:flex;align-items:center;gap:10px}
.lab i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.name{margin-top:22px;font-size:40px;font-weight:600;line-height:1.1}
.rank{margin-top:10px;font-size:25px;color:var(--muted)}
.bars{margin:28px 0 8px;display:flex;gap:7px}
.bars span{flex:1;height:44px;border-radius:9px;background:rgba(255,255,255,.12)}
.bars span.me{background:linear-gradient(180deg,var(--coral),#c4604c);box-shadow:0 0 26px rgba(242,154,133,.65)}
.bl{display:flex;justify-content:space-between;font-size:14px;letter-spacing:2px;color:#8f879f;text-transform:uppercase}
.verdict{margin-top:30px;display:inline-flex;align-items:center;gap:14px;padding:16px 28px;border-radius:999px;font-family:"Geist Pixel Circle",monospace;font-size:44px;letter-spacing:2px;color:#2a0f09;background:linear-gradient(90deg,var(--coral),var(--peach));box-shadow:0 12px 40px rgba(242,154,133,.5)}
.note{margin-top:18px;font-size:17px;color:#a79fb8}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="brand"><span class="dot"></span>CultureForge <b>AI</b></div>
<h1>Can your idea be told <em>no?</em></h1>
<div class="sub">An AI that tests business ideas against real Qloo evidence.</div>
<div class="foot">Qloo Agentic Hackathon 2026</div>
<div class="card">
 <div class="lab"><i></i>Tested against the evidence</div>
 <div class="name">The Little Bakery</div>
 <div class="rank">ranks 8th of 10 retrieved places</div>
 <div class="bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span class="me"></span><span></span><span></span></div>
 <div class="bl"><span>top</span><span>bottom</span></div>
 <div class="verdict">CONTESTED</div>
 <div class="note">Anchor fit within the sample, not demand.</div>
</div>
</body></html>
