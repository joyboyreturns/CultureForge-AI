<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CultureForge AI — demo diagrams</title>
<meta name="viewport" content="width=1920">
<style>
  @font-face { font-family: "Geist Pixel Circle"; src: url("../../../fonts/GeistPixel-Circle.woff2") format("woff2"); font-display: block; }
  :root {
    --bg: #07070b; --text: #f7f5f2; --muted: #c6c1cf; --subtle: #938d9f; --line: #2a2735;
    --accent: #c7a3ff; --peach: #f0b08f; --mint: #9fe3c4; --coral: #f29a85; --amber: #e3ca8c; --grey: #8c869a;
    --display: "Geist Pixel Circle", "Inter", monospace;
    --sans: "Inter", -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; font-family: var(--sans); color: var(--text); }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(1300px 760px at 80% 0%, rgba(120, 72, 196, .42), transparent 62%),
                radial-gradient(1000px 640px at 0% 100%, rgba(196, 92, 112, .24), transparent 62%), #07070b; }
  .stage::before { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.4px); background-size: 38px 38px; }
  .kicker { position: absolute; left: 110px; top: 74px; font: 500 20px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  .kicker::before { content: ""; display: inline-block; width: 46px; height: 2px; background: var(--accent); vertical-align: middle; margin-right: 16px; }
  h1 { position: absolute; left: 110px; top: 112px; width: 1700px; font: 400 66px/1.08 var(--display); letter-spacing: -.02em; }
  h1 em { font-style: normal; color: var(--accent); }
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.on { opacity: 1; transform: none; }

  .node { position: absolute; border-radius: 24px; padding: 22px 28px; background: rgba(28, 25, 40, .8); border: 1.6px solid var(--c, #3a3450);
    box-shadow: 0 26px 70px rgba(2, 1, 6, .5), inset 0 0 0 1px rgba(255,255,255,.03); backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(18px) scale(.97); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  .node.on { opacity: 1; transform: none; }
  .node .tag { font: 600 15px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--c); margin-bottom: 12px; }
  .node h3 { font: 600 31px/1.15 var(--sans); letter-spacing: -.02em; }
  .node p { margin-top: 10px; font: 400 21px/1.4 var(--sans); color: var(--muted); }
  .node code { font: 500 .92em ui-monospace, "SF Mono", Menlo, monospace; color: var(--c); }
  .q { --c: var(--peach); background: linear-gradient(135deg, rgba(240,176,143,.16), rgba(28,25,40,.82)); }
  .r { --c: var(--accent); background: linear-gradient(135deg, rgba(199,163,255,.16), rgba(28,25,40,.82)); }
  .m { --c: var(--mint); background: linear-gradient(135deg, rgba(159,227,196,.14), rgba(28,25,40,.82)); }
  .x { --c: var(--grey); }
  .bad { --c: var(--coral); background: linear-gradient(135deg, rgba(242,154,133,.16), rgba(28,25,40,.82)); }
  .warn { --c: var(--amber); background: linear-gradient(135deg, rgba(227,202,140,.15), rgba(28,25,40,.82)); }
  .good { --c: var(--mint); background: linear-gradient(135deg, rgba(159,227,196,.18), rgba(28,25,40,.82)); }
  .plain { background: transparent; border: 0; box-shadow: none; backdrop-filter: none; padding: 0; }

  svg.edges { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; overflow: visible; }
  .edge { fill: none; stroke: var(--c, #6e6684); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset .9s ease, opacity .2s; }
  .edge.on { stroke-dashoffset: 0; opacity: 1; }
  .edge.done { marker-end: url(#ah); }
  .edge.dash.on { stroke-dasharray: .018 .014; }
  .lbl { position: absolute; font: 500 19px/1.3 var(--sans); color: var(--subtle); }
  .caption { position: absolute; left: 110px; right: 110px; bottom: 58px; font: 500 28px/1.35 var(--sans); color: var(--muted); }
  .caption b { color: var(--text); font-weight: 600; }
  .legend { position: absolute; left: 110px; bottom: 58px; display: flex; gap: 46px; font: 500 22px/1 var(--sans); color: var(--muted); }
  .legend i { display: inline-block; width: 18px; height: 18px; border-radius: 6px; margin-right: 12px; vertical-align: -2px; background: var(--c); }
  .chip { display: inline-block; margin: 0 12px 12px 0; padding: 12px 20px; border-radius: 999px; border: 1.4px solid var(--c); background: rgba(255,255,255,.04); font: 500 24px/1 var(--sans); color: var(--text); opacity: 0; transform: scale(.92); transition: opacity .5s ease, transform .5s ease; }
  .chip.on { opacity: 1; transform: none; }
  .scene { display: none; position: absolute; inset: 0; }
  .scene.active { display: block; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg class="edges" id="svg" viewBox="0 0 1920 1080">
    <defs>
      <marker id="ah" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
        <path d="M1 1 L10 6 L1 11 z" fill="context-stroke"></path>
      </marker>
    </defs>
    <g id="edgeLayer"></g>
  </svg>
  <div id="root"></div>
</div>

<script>
// ---------------------------------------------------------------------------------------------
// Four short scenes. Every label is taken from the README ("How a brief becomes a verdict",
// "How the test can say no") and docs/EVIDENCE_POLICY.md; nothing here claims more than the product.
// ---------------------------------------------------------------------------------------------
const SCENES = {
  compare: {
    dur: 12,
    kicker: 'Why Qloo',
    title: 'Same question. <em>Different footing.</em>',
    items: [
      { t: .6, x: 130, y: 262, w: 700, cls: 'plain reveal', html: '<div style="font:600 26px var(--sans);color:var(--grey);letter-spacing:.02em">An ordinary language model</div>' },
      { t: .6, x: 1090, y: 262, w: 700, cls: 'plain reveal', html: '<div style="font:600 26px var(--sans);color:var(--peach);letter-spacing:.02em">CultureForge, built on Qloo</div>' },
      { t: .8, x: 960, y: 270, w: 2, h: 640, cls: 'reveal', style: 'background:#2a2735' },

      { t: 1.2, x: 130, y: 320, w: 700, h: 118, cls: 'node x', tag: 'Start', title: 'Your business idea' },
      { t: 2.2, x: 130, y: 490, w: 700, h: 118, cls: 'node x', tag: 'It answers', title: 'Fluent, confident text' },
      { t: 3.2, x: 130, y: 660, w: 700, h: 118, cls: 'node x', tag: 'It sounds', title: 'Plausible. Unchecked.' },
      { t: 4.2, x: 130, y: 830, w: 700, h: 118, cls: 'node bad', tag: 'The problem', title: 'Nothing to inspect or disprove' },

      { t: 5.0, x: 1090, y: 320, w: 700, h: 118, cls: 'node x', tag: 'Start', title: 'Your business idea' },
      { t: 6.0, x: 1090, y: 490, w: 700, h: 118, cls: 'node q', tag: 'Returned by Qloo', title: 'Real places, tags and audiences' },
      { t: 7.2, x: 1090, y: 660, w: 700, h: 118, cls: 'node r', tag: 'Composed by rules', title: 'Directions that cite that evidence' },
      { t: 8.4, x: 1090, y: 830, w: 700, h: 118, cls: 'node good', tag: 'Then it is tested', title: 'A check that can say no' },
    ],
    edges: [
      { t: 1.9, pts: [[480, 438], [480, 490]], c: '#8c869a' }, { t: 2.9, pts: [[480, 608], [480, 660]], c: '#8c869a' }, { t: 3.9, pts: [[480, 778], [480, 830]], c: '#f29a85' },
      { t: 5.7, pts: [[1440, 438], [1440, 490]], c: '#8c869a' }, { t: 6.9, pts: [[1440, 608], [1440, 660]], c: '#f0b08f' }, { t: 8.1, pts: [[1440, 778], [1440, 830]], c: '#c7a3ff' },
    ],
    caption: { t: 10, html: '<b>Every claim points to something Qloo returned.</b>' },
  },

  pipeline: {
    dur: 14,
    kicker: 'How it works',
    title: 'From a brief to a <em>verdict.</em>',
    items: [
      { t: 1.0, x: 110, y: 255, w: 380, h: 180, cls: 'node x', tag: 'Input', title: 'Your brief', sub: 'category, idea, audience, place' },
      { t: 2.0, x: 560, y: 255, w: 380, h: 180, cls: 'node r', tag: 'Rules', title: 'Read the idea', sub: 'hybrids, specialisations, simplifications disclosed' },
      { t: 3.0, x: 1010, y: 255, w: 380, h: 180, cls: 'node q', tag: 'Qloo', title: '<code>find_tags</code>', sub: 'audience and category tags, only from returned answers' },
      { t: 4.0, x: 1460, y: 255, w: 350, h: 180, cls: 'node q', tag: 'Qloo', title: 'Places and signals', sub: 'recommend, where_popular, entity_tags; held if seen before' },

      { t: 5.4, x: 110, y: 515, w: 380, h: 180, cls: 'node r', tag: 'Rules', title: 'Compose directions', sub: 'every decision cites its evidence' },
      { t: 6.4, x: 560, y: 515, w: 380, h: 180, cls: 'node r', tag: 'Rules', title: 'Initial answer', sub: 'on screen before any model runs' },
      { t: 7.4, x: 1010, y: 515, w: 380, h: 180, cls: 'node m', tag: 'Model, optional', title: 'Bounded agent', sub: 'up to 8 steps, approved Qloo workflows only' },
      { t: 8.4, x: 1460, y: 515, w: 350, h: 180, cls: 'node r', tag: 'Rules', title: 'Citation check', sub: 'a claim needs an observed Qloo ID or tag' },

      { t: 9.8, x: 110, y: 775, w: 380, h: 180, cls: 'node good', tag: 'Rules + Qloo', title: 'Evidence test', sub: 'supported, contested or unproven' },
      { t: 11.0, x: 1460, y: 775, w: 350, h: 180, cls: 'node x', tag: 'Output', title: 'Studio · PDF · share', sub: 'reopens exactly as saved' },
    ],
    edges: [
      { t: 1.7, pts: [[490, 345], [560, 345]], c: '#8c869a' }, { t: 2.7, pts: [[940, 345], [1010, 345]], c: '#c7a3ff' }, { t: 3.7, pts: [[1390, 345], [1460, 345]], c: '#f0b08f' },
      { t: 5.0, pts: [[1635, 435], [1635, 475], [300, 475], [300, 515]], c: '#f0b08f' },
      { t: 6.1, pts: [[490, 605], [560, 605]], c: '#c7a3ff' }, { t: 7.1, pts: [[940, 605], [1010, 605]], c: '#c7a3ff' }, { t: 8.1, pts: [[1390, 605], [1460, 605]], c: '#9fe3c4' },
      { t: 9.5, pts: [[300, 695], [300, 775]], c: '#c7a3ff' },
      { t: 10.6, pts: [[490, 865], [1460, 865]], c: '#9fe3c4' },
      { t: 11.2, pts: [[1635, 695], [1635, 775]], c: '#c7a3ff' },
    ],
    legend: { t: 12.2, html: '<span style="--c:var(--peach)"><i></i>Returned by Qloo</span><span style="--c:var(--accent)"><i></i>Decided by rules</span><span style="--c:var(--mint)"><i></i>Written by the model (optional)</span>' },
  },

  verdict: {
    dur: 14,
    kicker: 'The evidence test',
    title: 'A check that can <em>say no.</em>',
    items: [
      { t: 1.0, x: 110, y: 470, w: 400, h: 170, cls: 'node r', tag: 'Start', title: 'A direction and its anchor place', sub: 'the venue the idea is built on' },
      { t: 2.6, x: 620, y: 285, w: 430, h: 200, cls: 'node q', tag: 'Qloo · rank', title: 'Where does the anchor rank?', sub: 'among the places returned, for a demographic profile' },
      { t: 3.2, x: 620, y: 585, w: 430, h: 200, cls: 'node q', tag: 'Qloo · compare', title: 'What tags set it apart?', sub: 'anchor tags against every other returned place' },
      { t: 5.0, x: 1140, y: 470, w: 280, h: 170, cls: 'node r', tag: 'Policy', title: '<code>anchor-fit-5</code>', sub: 'one written rule, versioned' },
      { t: 5.75, x: 1520, y: 300, w: 290, h: 128, cls: 'node good', tag: 'Both checks pass', title: 'Supported' },
      { t: 7.65, x: 1520, y: 472, w: 290, h: 128, cls: 'node warn', tag: 'A check is missing', title: 'Unproven' },
      { t: 9.85, x: 1520, y: 644, w: 290, h: 128, cls: 'node bad', tag: 'A check fails', title: 'Contested' },
      { t: 11.75, x: 620, y: 860, w: 1000, h: 76, cls: 'node r', tag: '', title: 'Re-anchor to another place, then test again', style: 'padding:18px 28px' },
    ],
    edges: [
      { t: 2.2, pts: [[510, 520], [565, 520], [565, 385], [620, 385]], c: '#c7a3ff' },
      { t: 2.8, pts: [[510, 590], [565, 590], [565, 685], [620, 685]], c: '#c7a3ff' },
      { t: 4.5, pts: [[1050, 385], [1095, 385], [1095, 520], [1140, 520]], c: '#f0b08f' },
      { t: 4.7, pts: [[1050, 685], [1095, 685], [1095, 590], [1140, 590]], c: '#f0b08f' },
      { t: 5.4, pts: [[1420, 555], [1470, 555], [1470, 364], [1520, 364]], c: '#9fe3c4' },
      { t: 7.3, pts: [[1420, 555], [1520, 555]], c: '#e3ca8c' },
      { t: 9.5, pts: [[1420, 555], [1470, 555], [1470, 708], [1520, 708]], c: '#f29a85' },
      { t: 11.4, pts: [[1665, 772], [1665, 898], [1620, 898]], c: '#c7a3ff' },
      { t: 12.2, pts: [[620, 898], [310, 898], [310, 640]], c: '#c7a3ff' },
    ],
    caption: { t: 13.0, html: 'A verdict about <b>anchor fit within the retrieved sample</b>. Not demand, rent or willingness to pay.', y: 970 },
  },

  layers: {
    dur: 12,
    kicker: 'Who wrote what',
    title: 'Three layers, <em>kept apart.</em>',
    items: [
      { t: 2.05, x: 110, y: 290, w: 1700, h: 188, cls: 'node q', tag: 'Returned by Qloo', title: 'The evidence', laneChips: { t0: 2.3, step: .3, chips: ['Places', 'Tags', 'Affinity and popularity', 'Photos', 'Audience comparisons'] } },
      { t: 3.65, x: 110, y: 520, w: 1700, h: 188, cls: 'node r', tag: 'Decided by rules', title: 'The reasoning', laneChips: { t0: 4.0, step: .3, chips: ['Which places count as the same business', 'Directions and their citations', 'Test verdicts', 'Policy version'] } },
      { t: 5.25, x: 110, y: 750, w: 1700, h: 188, cls: 'node m', tag: 'Written by a model, optional', title: 'The wording', laneChips: { t0: 5.65, step: .45, chips: ['Direction names', 'Analysis text: rejected unless every claim cites a Qloo ID'] } },
    ],
    edges: [
      { t: 7.3, pts: [[78, 844], [78, 384]], c: '#9fe3c4' },
    ],
    extra: [{ t: 7.5, x: 6, y: 590, html: '<div style="writing-mode:vertical-rl;transform:rotate(180deg);font:600 18px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mint)">every claim cites back to Qloo</div>' }],
    caption: { t: 8.0, html: 'If the model fails or is off, <b>the rule-based answer stands</b>, and says so.', y: 985 },
  },
};

// ---------------------------------------------------------------------------------------------
const NS = 'http://www.w3.org/2000/svg';
const name = (location.hash || '#compare').slice(1);
const scene = SCENES[name];
const root = document.getElementById('root');
const layer = document.getElementById('edgeLayer');
const timers = [];

function at(el, t) { el.dataset.t = t; }
function add(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

function build() {
  root.appendChild(add(`<div class="kicker reveal" data-t="0.2">${scene.kicker}</div>`));
  root.appendChild(add(`<h1 class="reveal" data-t="0.35">${scene.title}</h1>`));
  for (const it of scene.items) {
    const el = document.createElement('div');
    el.className = it.cls; el.dataset.t = it.t;
    Object.assign(el.style, { position: 'absolute', left: it.x + 'px', top: it.y + 'px', width: it.w + 'px' });
    if (it.h) el.style.height = it.h + 'px';
    if (it.style) el.style.cssText += ';' + it.style;
    el.innerHTML = it.html ?? (it.title === undefined ? '' : (it.tag ? `<div class="tag">${it.tag}</div>` : '') + `<h3>${it.title}</h3>` + (it.sub ? `<p>${it.sub}</p>` : ''));
    if (it.laneChips) {
      const row = document.createElement('div'); row.style.marginTop = '18px';
      it.laneChips.chips.forEach((c, i) => { const s = document.createElement('span'); s.className = 'chip'; s.textContent = c; s.dataset.t = it.laneChips.t0 + i * it.laneChips.step; s.style.setProperty('--c', getComputedStyle(el).getPropertyValue('--c')); row.appendChild(s); });
      el.appendChild(row);
    }
    root.appendChild(el);
  }
  for (const ex of scene.extra || []) { const el = add(`<div class="reveal" style="position:absolute;left:${ex.x}px;top:${ex.y}px">${ex.html}</div>`); el.dataset.t = ex.t; root.appendChild(el); }
  for (const e of scene.edges || []) {
    if (e.hidden) continue;
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', 'M' + e.pts.map((q) => q.join(' ')).join(' L')); p.setAttribute('pathLength', '1');
    p.setAttribute('class', 'edge'); p.style.setProperty('--c', e.c); p.dataset.t = e.t; layer.appendChild(p);
  }
  if (scene.legend) { const el = add(`<div class="legend reveal">${scene.legend.html}</div>`); el.dataset.t = scene.legend.t; root.appendChild(el); }
  if (scene.caption) { const el = add(`<div class="caption reveal">${scene.caption.html}</div>`); if (scene.caption.y) { el.style.bottom = 'auto'; el.style.top = scene.caption.y + 'px'; } el.dataset.t = scene.caption.t; root.appendChild(el); }
}

// Chips take their colour from the lane once it is in the DOM.
function colourChips() { document.querySelectorAll('.chip').forEach((c) => c.style.setProperty('--c', getComputedStyle(c.closest('.node')).getPropertyValue('--c'))); }

window.sceneDuration = scene.dur;
window.go = () => {
  document.querySelectorAll('[data-t]').forEach((el) => { const t = parseFloat(el.dataset.t) * 1000; timers.push(setTimeout(() => el.classList.add('on'), t)); if (el.classList.contains('edge')) timers.push(setTimeout(() => el.classList.add('done'), t + 850)); });
};
build(); colourChips();
document.fonts.ready.then(() => { window.ready = true; });
</script>
</body>
</html>
