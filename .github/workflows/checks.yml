name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # The suite cannot reach Qloo or a model (backend/tests/conftest.py blocks
    # both); these make the same promise at the job level.
    env:
      CULTUREFORGE_PROVIDER: mock
      RUN_PROFILE: dev
      AI_GATEWAY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run lint
      - run: npm run build            # tsc -b, then vite build
      - run: python -m pytest backend/tests -q --cov=backend --cov-report=term-missing:skip-covered --cov-report=xml
      - run: npm run test:unit
      - run: npm run check:submission
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
